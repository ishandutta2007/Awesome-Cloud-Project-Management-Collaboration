<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .flow-pulse {
        animation: dashPulse 4s linear infinite;
      }
      .card-float {
        animation: cardFloat 6s ease-in-out infinite alternate;
      }
      .card-float-delayed {
        animation: cardFloat 7s ease-in-out 1.5s infinite alternate;
      }
      .tag-pulse {
        animation: pulseTag 3s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(120px, 50px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-100px, -40px) scale(1.2); }
      }
      @keyframes dashPulse {
        to { stroke-dashoffset: -40; }
      }
      @keyframes cardFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pulseTag {
        0% { opacity: 0.85; }
        100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <g opacity="0.35">
    <circle class="orb-1" cx="200" cy="100" r="160" fill="#0284c7" filter="url(#glowCyan)" />
    <circle class="orb-2" cx="1000" cy="300" r="200" fill="#7c3aed" filter="url(#glowPurple)" />
    <circle cx="600" cy="380" r="130" fill="#0d9488" filter="url(#glowCyan)" opacity="0.4" />
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Background Abstract Flow Lines (Below Content) -->
  <g opacity="0.4">
    <path d="M 50 350 Q 300 280, 600 360 T 1150 300" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" class="flow-pulse" />
    <path d="M 80 80 Q 400 140, 750 60 T 1120 120" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 8" class="flow-pulse" />
  </g>

  <!-- Dynamic Decorative Background Elements (Project Management Kanban & Timeline Motifs) -->
  <g class="card-float" opacity="0.32" transform="translate(60, 40)">
    <rect width="140" height="70" rx="8" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="12" y="14" width="60" height="6" rx="3" fill="#38bdf8" />
    <rect x="12" y="28" width="115" height="4" rx="2" fill="#64748b" />
    <rect x="12" y="38" width="90" height="4" rx="2" fill="#475569" />
    <circle cx="118" cy="54" r="6" fill="#10b981" />
  </g>

  <g class="card-float-delayed" opacity="0.32" transform="translate(1000, 45)">
    <rect width="140" height="70" rx="8" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="12" y="14" width="70" height="6" rx="3" fill="#c084fc" />
    <rect x="12" y="28" width="110" height="4" rx="2" fill="#64748b" />
    <rect x="12" y="38" width="75" height="4" rx="2" fill="#475569" />
    <rect x="12" y="50" width="45" height="10" rx="4" fill="#a855f7" fill-opacity="0.4" />
  </g>

  <g class="card-float" opacity="0.28" transform="translate(980, 275)">
    <rect width="160" height="85" rx="8" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="16" width="80" height="6" rx="3" fill="#34d399" />
    <rect x="15" y="32" width="130" height="6" rx="3" fill="#1e293b" />
    <rect x="15" y="32" width="95" height="6" rx="3" fill="#10b981" />
    <rect x="15" y="48" width="110" height="4" rx="2" fill="#64748b" />
    <circle cx="25" cy="66" r="6" fill="#38bdf8" />
    <circle cx="42" cy="66" r="6" fill="#f43f5e" />
  </g>

  <g class="card-float-delayed" opacity="0.25" transform="translate(60, 280)">
    <rect width="150" height="80" rx="8" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="14" y="14" width="70" height="6" rx="3" fill="#fbbf24" />
    <rect x="14" y="30" width="120" height="4" rx="2" fill="#64748b" />
    <rect x="14" y="42" width="80" height="4" rx="2" fill="#475569" />
    <circle cx="125" cy="60" r="7" fill="#fbbf24" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g class="tag-pulse" transform="translate(600, 68)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="2">
      ⚡ CLOUD PM &amp; COLLABORATION ECOSYSTEM
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Cloud Project Management
  </text>
  <text x="600" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.2">
    &amp; Team Collaboration Tools
  </text>

  <!-- FOREGROUND CONTENT: Subtitle / Value Prop -->
  <text x="600" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
    Curated SaaS Work OS Platforms &amp; Self-Hosted Open-Source Kanban, Gantt, and Agile Suites
  </text>

  <!-- FOREGROUND CONTENT: Feature Pills / Badges in Banner -->
  <g transform="translate(600, 310)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">SaaS Platforms</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#a855f7" />
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Open Source</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="175" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Kanban &amp; Gantt</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="175" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#f59e0b" />
      <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Self-Hostable</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#textGrad)" />
</svg>
